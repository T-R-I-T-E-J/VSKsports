services:
  db:
    image: postgres:16
    container_name: vsk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vsk
      POSTGRES_PASSWORD: vsk
      POSTGRES_DB: vsk_sports
    # Host 5544 -> container 5432. 5544 avoids native Postgres on 5432/5433 and
    # stays below Windows' WinNAT-reserved ephemeral range (which can grab 55432+,
    # producing "bind: forbidden by its access permissions" on docker start).
    ports:
      - "5544:5432"
    volumes:
      - vsk_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vsk -d vsk_sports"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vsk_pgdata:
