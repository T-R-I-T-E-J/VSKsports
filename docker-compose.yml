services:
  db:
    image: postgres:16
    container_name: vsk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vsk
      POSTGRES_PASSWORD: vsk
      POSTGRES_DB: vsk_sports
    # Host 55432 chosen to avoid a native Postgres already on 5432/5433.
    ports:
      - "55432:5432"
    volumes:
      - vsk_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vsk -d vsk_sports"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vsk_pgdata:
